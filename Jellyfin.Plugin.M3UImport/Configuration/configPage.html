<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>M3U Import</title></head>
<body>
<div id="M3UImportPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-checkbox,emby-select">
  <div data-role="content">
    <div class="content-primary">
      <h2 data-i18n="title">Import M3U playlist</h2>
      <div class="inputContainer">
        <label><span data-i18n="file">M3U file</span><br /><input id="m3uFile" type="file" accept=".m3u,.m3u8,text/plain" /></label>
      </div>
      <div class="inputContainer">
        <input is="emby-input" id="m3uName" type="text" label="Playlist name" data-i18n-label="name" />
        <div class="fieldDescription" data-i18n="nameHint">Filled in from the file name; change it if you like.</div>
      </div>
      <div class="selectContainer">
        <select is="emby-select" id="m3uExisting" label="If a playlist with this name already exists" data-i18n-label="existing">
          <option value="stop" selected data-i18n="optStop">Stop and warn me</option>
          <option value="append" data-i18n="optAppend">Add the tracks to the existing playlist</option>
          <option value="replace" data-i18n="optReplace">Replace the existing playlist</option>
          <option value="new" data-i18n="optNew">Create another playlist with the same name</option>
        </select>
        <div class="fieldDescription" data-i18n="existingHint">Only playlists you own are considered. This choice is not remembered.</div>
      </div>
      <details id="m3uAdvanced" style="margin:1em 0;">
        <summary style="cursor:pointer;" data-i18n="advanced">Advanced: path mappings (optional)</summary>
        <div style="margin-top:.8em;">
          <div class="fieldDescription" style="margin-bottom:.6em;" data-i18n-html="advancedHint"></div>
          <textarea id="m3uMappings" rows="4" spellcheck="false"
                    style="width:100%;box-sizing:border-box;background:transparent;color:inherit;
                           border:1px solid rgba(128,128,128,.5);border-radius:.3em;padding:.6em;
                           font-family:monospace;font-size:inherit;"></textarea>
        </div>
      </details>
      <div class="checkboxContainer checkboxContainer-withDescription">
        <label>
          <input is="emby-checkbox" id="m3uDedupe" type="checkbox" checked />
          <span data-i18n="dedupe">Skip duplicate tracks</span>
        </label>
      </div>
      <div class="checkboxContainer checkboxContainer-withDescription">
        <label>
          <input is="emby-checkbox" id="m3uNameOnly" type="checkbox" checked />
          <span data-i18n="nameOnly">Also match by file name alone (only if the name is unique in the library)</span>
        </label>
        <div class="fieldDescription checkboxFieldDescription" data-i18n="nameOnlyHint">
          Helps when tracks were moved to different folders. Turn off if you get wrong matches.
        </div>
      </div>
      <button is="emby-button" id="m3uImport" type="button" class="raised button-submit block">
        <span data-i18n="import">Import</span>
      </button>
      <pre id="m3uResult" style="white-space:pre-wrap;margin-top:1em;"></pre>
    </div>
  </div>
  <script type="text/javascript">
    (function () {
      var pluginId = '5b8d1c9e-3f4a-4c7b-9a21-6d0e8f2a7c14';
      var page = document.querySelector('#M3UImportPage');
      var $ = function (id) { return page.querySelector(id); };
      var autoName = '';   // the last name we filled in ourselves

      // ------------------------------------------------------------ translations
      // Texts come from the server (Configuration/lang/<code>.json, embedded in the plugin).
      // The English texts in this HTML are only the fallback if loading fails.
      var strings = {};

      // Language candidates, best first: the Jellyfin user's display language, then the
      // page language, then the browser language. The server picks the first it has a file for.
      function languageCandidates() {
        var list = [];
        try {
          var uid = ApiClient.getCurrentUserId();
          list.push(localStorage.getItem(uid + '-language'));
          list.push(localStorage.getItem('language'));
        } catch (e) { /* ignore */ }
        list.push(document.documentElement.getAttribute('lang'));
        list.push(navigator.language);
        return list.filter(function (x) { return !!x; });
      }

      function t(key) {
        var s = strings[key];
        if (s === undefined) { return key; }
        for (var i = 1; i < arguments.length; i++) {
          s = s.split('{' + (i - 1) + '}').join(arguments[i]);
        }
        return s;
      }

      function setLabel(el, text) {
        el.setAttribute('label', text);
        var generated = el.parentNode && el.parentNode.querySelector('label');
        if (generated && generated !== el) { generated.textContent = text; }
      }

      function applyI18n() {
        if (!Object.keys(strings).length) { return; }
        Array.prototype.forEach.call(page.querySelectorAll('[data-i18n]'), function (el) {
          el.textContent = t(el.getAttribute('data-i18n'));
        });
        Array.prototype.forEach.call(page.querySelectorAll('[data-i18n-html]'), function (el) {
          el.innerHTML = t(el.getAttribute('data-i18n-html'));
        });
        Array.prototype.forEach.call(page.querySelectorAll('[data-i18n-label]'), function (el) {
          setLabel(el, t(el.getAttribute('data-i18n-label')));
        });
      }

      function loadStrings() {
        return ApiClient.ajax({
          type: 'GET',
          url: ApiClient.getUrl('M3UImport/Strings', { lang: languageCandidates().join(',') }),
          dataType: 'json'
        }).then(function (r) {
          strings = r.Strings || {};
          applyI18n();
        });
      }
      loadStrings().catch(function () { /* keep the English fallback texts */ });

      // ------------------------------------------------------------------- page
      page.addEventListener('pageshow', function () {
        applyI18n();
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (c) {
          $('#m3uMappings').value = c.PrefixMappings || '';
          $('#m3uAdvanced').open = !!(c.PrefixMappings && c.PrefixMappings.trim());
          $('#m3uDedupe').checked = c.Deduplicate !== false;
          $('#m3uNameOnly').checked = c.AllowNameOnly !== false;
          $('#m3uExisting').value = 'stop';
          Dashboard.hideLoadingMsg();
        });
      });

      // Pre-fill the playlist name from the file name, unless the user typed their own.
      $('#m3uFile').addEventListener('change', function () {
        var f = this.files[0];
        if (!f) { return; }
        var base = f.name.replace(/\.(m3u8?|txt)$/i, '');
        var current = $('#m3uName').value.trim();
        if (!current || current === autoName) {
          $('#m3uName').value = base;
          autoName = base;
        }
      });

      $('#m3uImport').addEventListener('click', function () {
        var file = $('#m3uFile').files[0];
        var name = $('#m3uName').value.trim();
        if (!file || !name) { Dashboard.alert(t('chooseFileName')); return; }
        var btn = $('#m3uImport');
        btn.disabled = true;
        var reader = new FileReader();
        reader.onerror = function () {
          btn.disabled = false;
          Dashboard.alert(t('readError'));
        };
        reader.onload = function () {
          var mappings = $('#m3uMappings').value;
          var dedupe = $('#m3uDedupe').checked;
          var nameOnly = $('#m3uNameOnly').checked;
          var existing = $('#m3uExisting').value;
          Dashboard.showLoadingMsg();
          ApiClient.getPluginConfiguration(pluginId).then(function (c) {
            c.PrefixMappings = mappings;
            c.Deduplicate = dedupe;
            c.AllowNameOnly = nameOnly;
            return ApiClient.updatePluginConfiguration(pluginId, c);
          }).then(function () {
            return ApiClient.ajax({
              type: 'POST',
              url: ApiClient.getUrl('M3UImport/Import'),
              contentType: 'application/json',
              dataType: 'json',
              data: JSON.stringify({
                Name: name, Content: reader.result,
                UserId: ApiClient.getCurrentUserId(), Mappings: mappings,
                Deduplicate: dedupe, AllowNameOnly: nameOnly,
                ExistingAction: existing
              })
            });
          }).then(function (r) {
            Dashboard.hideLoadingMsg();
            btn.disabled = false;

            var text = '';
            if (r.ExistingFound && r.Action === 'none') {
              text += t('existsWarn', name, r.ExistingTracks, t('existing')) + '\n\n';
            }
            text +=
              t('libraryTracks', r.LibraryTracks) +
              '\n' + t('lines', r.TotalLines) +
              '\n' + t('matched', r.Matched, r.TailMatched, r.NameOnlyMatched) +
              '\n' + t('dupes', r.Duplicates) +
              '\n' + t('notFoundCount', r.MissingCount);

            var result = '';
            if (r.Action === 'created') {
              result = t('created', r.TracksAdded);
            } else if (r.Action === 'appended') {
              result = t('appended', r.TracksAdded);
            } else if (r.Action === 'replaced') {
              result = t('replaced', r.TracksAdded);
            } else if (!r.ExistingFound) {
              result = t('noMatch');
            }
            if (result) { text += '\n\n' + result; }

            if (r.Missing.length) {
              var lines = r.Missing.map(function (m) {
                var hint = m.LibraryPath
                  ? t('hintSame', m.LibraryPath) + (m.MoreCount > 0 ? t('hintSameMore', m.MoreCount) : '')
                  : t('hintNone');
                return m.Line + '\n      -> ' + hint;
              });
              text += '\n\n' + (r.MissingCount > r.Missing.length
                ? t('notFoundListCapped', r.Missing.length) : t('notFoundList')) +
                '\n' + lines.join('\n');
            }
            if (reader.result.indexOf('\uFFFD') >= 0) {
              text += '\n\n' + t('badEncoding');
            }
            $('#m3uResult').textContent = text;

            // Never leave "replace"/"append" armed for the next import.
            if (r.Action !== 'none') { $('#m3uExisting').value = 'stop'; }
          }).catch(function (e) {
            Dashboard.hideLoadingMsg();
            btn.disabled = false;
            Dashboard.alert(t('importFailed', e && e.statusText ? e.statusText : e));
          });
        };
        reader.readAsText(file);
      });
    })();
  </script>
</div>
</body>
</html>
